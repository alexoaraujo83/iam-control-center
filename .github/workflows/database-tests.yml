name: database-schema-tests

on:
  pull_request:
    paths:
      - "database/**"
      - "iam_database_schema.sql"
      - "docs/operations/iam-migration-execution-contract.md"
      - "docs/database/iam-postgresql-test-matrix.md"
      - "docs/database/neon-source-baseline-reconciliation.md"
      - "docs/database/schema-manifest-contract.md"
      - "role-security-harness/**"
      - "scripts/test-postgres18-role-security-harness.sh"
      - "docs/architecture/iam-decisions.md"
      - "docs/architecture/tenant-context-rfc.md"
      - "docs/operations/iam-role-bootstrap-review.md"
      - ".github/workflows/database-tests.yml"
  push:
    branches:
      - "feat/iam-schema-migration-review"
      - "feat/iam-role-bootstrap-review"
    paths:
      - "database/**"
      - "iam_database_schema.sql"
      - "docs/operations/iam-migration-execution-contract.md"
      - "docs/database/iam-postgresql-test-matrix.md"
      - "docs/database/neon-source-baseline-reconciliation.md"
      - "docs/database/schema-manifest-contract.md"
      - "role-security-harness/**"
      - "scripts/test-postgres18-role-security-harness.sh"
      - "docs/architecture/iam-decisions.md"
      - "docs/architecture/tenant-context-rfc.md"
      - "docs/operations/iam-role-bootstrap-review.md"
      - ".github/workflows/database-tests.yml"

permissions:
  contents: read

concurrency:
  group: database-schema-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-18:
    name: postgres-18-schema-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: iam_schema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iam_schema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/iam_schema_test
      BOOTSTRAP_DATABASE_URL: postgresql://iam_bootstrap_admin@localhost:5432/iam_schema_test
      MIGRATOR_DATABASE_URL: postgresql://iam_migrator_login@localhost:5432/iam_schema_test
      POSTGRES_TEST_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify PostgreSQL version
        run: PGPASSWORD="$POSTGRES_TEST_PASSWORD" psql "$DATABASE_URL" -Atc "SHOW server_version;"
      - name: Run role bootstrap and migration contract tests
        run: bash database/tests/run.sh
      - name: Generate and validate deterministic PostgreSQL schema manifest
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD="$POSTGRES_TEST_PASSWORD"
          mkdir -p artifacts
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At \
            -f database/scripts/schema-manifest.sql > artifacts/schema-manifest-a.json
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At \
            -f database/scripts/schema-manifest.sql > artifacts/schema-manifest-b.json
          cmp artifacts/schema-manifest-a.json artifacts/schema-manifest-b.json
          python3 database/tests/validate-schema-manifest.py artifacts/schema-manifest-a.json
          sha256sum artifacts/schema-manifest-a.json

  postgres-18-main-baseline-restore-manifest:
    name: postgres-18-main-baseline-restore-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: iam_source_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iam_source_restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/iam_source_restore_test
      PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout candidate manifest tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Checkout current main baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: main
          path: base-main
          persist-credentials: false
      - name: Restore current main baseline in disposable PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/base-main \
            --env DATABASE_URL="$DATABASE_URL" \
            --env PGPASSWORD="$PGPASSWORD" \
            postgres:18-bookworm \
            bash -euo pipefail -c '
              test "$(psql -X --no-password "$DATABASE_URL" -Atc "SELECT current_setting('server_version_num')::integer / 10000;")" = "18"
              bash database/tests/restore-source-schema.sh
            '
      - name: Generate and validate main baseline manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env DATABASE_URL="$DATABASE_URL" \
            --env PGPASSWORD="$PGPASSWORD" \
            postgres:18-bookworm \
            bash -euo pipefail -c '
              psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At \
                -f base-main/database/scripts/schema-manifest.sql > artifacts/main-baseline-manifest-a.json
              psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At \
                -f base-main/database/scripts/schema-manifest.sql > artifacts/main-baseline-manifest-b.json
            '
          cmp artifacts/main-baseline-manifest-a.json artifacts/main-baseline-manifest-b.json
          python3 base-main/database/tests/validate-schema-manifest.py artifacts/main-baseline-manifest-a.json
          sha256sum artifacts/main-baseline-manifest-a.json
          python3 base-main/database/tests/render-schema-manifest-section-hashes.py base-main/database/scripts/schema-manifest.sql \
            | docker run --rm -i --network host \
                --env DATABASE_URL="$DATABASE_URL" \
                --env PGPASSWORD="$PGPASSWORD" \
                postgres:18-bookworm \
                psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At \
            > artifacts/main-baseline-section-hashes.tsv
          echo "Main baseline manifest section hashes (section, item_count, sha256):"
          cat artifacts/main-baseline-section-hashes.tsv
          python3 database/tests/verify-source-structural-parity.py \
            database/evidence/neon-source-structural-fingerprints.json \
            artifacts/main-baseline-section-hashes.tsv

  restore-source-schema:
    name: postgres-18-candidate-source-schema-restore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: iam_candidate_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iam_candidate_restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/iam_candidate_restore_test
      PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout candidate PR source dump
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Restore candidate source schema with PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env DATABASE_URL="$DATABASE_URL" \
            --env PGPASSWORD="$PGPASSWORD" \
            postgres:18-bookworm \
            bash -euo pipefail -c '
              test "$(psql -X --no-password "$DATABASE_URL" -Atc "SELECT current_setting('server_version_num')::integer / 10000;")" = "18"
              bash database/tests/restore-source-schema.sh
            '
      - name: Verify candidate portable schema against pinned Neon source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 database/tests/render-schema-manifest-section-hashes.py database/scripts/schema-manifest.sql \
            | docker run --rm -i --network host \
                --env DATABASE_URL="$DATABASE_URL" \
                --env PGPASSWORD="$PGPASSWORD" \
                postgres:18-bookworm \
                psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At \
            > artifacts/candidate-source-section-hashes.tsv
          python3 database/tests/verify-source-structural-parity.py \
            database/evidence/neon-source-structural-fingerprints.json \
            artifacts/candidate-source-section-hashes.tsv


  classify_db_preview:
    name: db-preview-scope
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      eligible: ${{ steps.paths.outputs.eligible }}
    steps:
      - name: Classify both original and destination paths
        id: paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[] | {filename, previous_filename}')"
          test -n "${changed}" || { echo "::error::Empty PR file set"; exit 1; }
          eligible=true
          database_touched=false
          while IFS= read -r entry; do
            file="$(jq -r '.filename' <<< "${entry}")"
            previous="$(jq -r '.previous_filename // empty' <<< "${entry}")"
            for candidate in "${file}" "${previous}"; do
              [[ -n "${candidate}" ]] || continue
              case "${candidate}" in
                database/*|iam_database_schema.sql|role-security-harness/*|scripts/test-postgres18-role-security-harness.sh)
                  database_touched=true
                  ;;
                docs/*|.github/workflows/database-tests.yml)
                  ;;
                *)
                  eligible=false
                  ;;
              esac
            done
          done <<< "${changed}"
          if [[ "${database_touched}" != "true" ]]; then eligible=false; fi
          echo "eligible=${eligible}" >> "${GITHUB_OUTPUT}"

  db_preview_verification:
    name: db-preview-verification
    needs:
      - classify_db_preview
      - postgres-18
      - postgres-18-main-baseline-restore-manifest
      - restore-source-schema
    if: needs.classify_db_preview.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      statuses: read
    steps:
      - name: Verify completed Vercel Preview for exact PR SHA before deployment registration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            response="$(gh api "repos/${REPOSITORY}/commits/${COMMIT_SHA}/status")"
            row="$(jq -c '[.statuses[] | select(.context == "Vercel")] | first // {}' <<< "${response}")"
            state="$(jq -r '.state // "missing"' <<< "${row}")"
            description="$(jq -r '.description // ""' <<< "${row}")"
            target="$(jq -r '.target_url // ""' <<< "${row}")"
            if [[ "${state}" == "success" && "${description}" == "Deployment has completed" && "${target}" =~ ^https://vercel\.com/alexoaraujo83-8387s-projects/iam-control-center/[a-zA-Z0-9]+$ ]]; then
              echo "PASS exact-SHA Vercel READY: ${COMMIT_SHA}"
              echo "Evidence: ${target}"
              exit 0
            fi
            if [[ "${state}" == "failure" || "${state}" == "error" ]]; then
              echo "::error::Vercel failed for exact SHA"
              exit 1
            fi
            sleep 10
          done
          echo "::error::No completed Vercel deployment for exact SHA"
          exit 1

  db_preview_gate:
    name: db-preview-gate
    needs:
      - classify_db_preview
      - db_preview_verification
      - postgres-18
      - postgres-18-main-baseline-restore-manifest
      - restore-source-schema
    if: needs.classify_db_preview.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: Preview
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Register Preview after independent exact-SHA verification and PG18 success
        run: |
          echo "PASS Preview verification and three PostgreSQL 18 jobs"
