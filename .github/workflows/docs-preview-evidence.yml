name: Documentation Preview deployment evidence

on:
  pull_request:
    paths:
      - "SCAFFOLD-MANIFEST.json"
      - "docs/**"
      - ".github/workflows/docs-preview-evidence.yml"

permissions:
  contents: read

jobs:
  verify-documentation-preview:
    name: documentation-preview-evidence
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: Preview
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      checks: read
      deployments: write
    steps:
      - name: Verify documentation-only changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
          test -n "${files}" || { echo "::error::PR changed file list is empty."; exit 1; }
          while IFS= read -r path; do
            case "${path}" in
              SCAFFOLD-MANIFEST.json|docs/*|.github/workflows/docs-preview-evidence.yml)
                ;;
              *)
                echo "::error::Not a documentation-only PR; refusing documentation deployment gate."
                exit 1
                ;;
            esac
          done <<< "${files}"
          echo "Documentation-only path allowlist verified."

      - name: Verify exact-SHA Vercel Preview before reporting deployment success
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            status="$(gh api "repos/${REPOSITORY}/commits/${COMMIT_SHA}/status" --jq '[.statuses[] | select(.context == "Vercel")] | first | .state // "missing"')"
            if [[ "${status}" == "failure" || "${status}" == "error" ]]; then
              echo "::error::Vercel reported ${status} for exact SHA."
              exit 1
            fi
            checks="$(gh api "repos/${REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100")"
            host="$(jq -er --arg sha "${COMMIT_SHA}" '
              [ .check_runs[]
                | select(
                    .head_sha == $sha
                    and .app.slug == "vercel"
                    and .name == "Vercel Preview Comments"
                    and .conclusion == "success"
                  )
                | (.output.summary // "")
                | try (capture("https://vercel\\.live/open-feedback/(?<host>[^/?#]+)").host) catch empty
              ]
              | unique
              | if length == 1 then .[0] else empty end
            ' <<< "${checks}" 2>/dev/null || true)"
            if [[ "${status}" == "success" && "${host}" =~ ^[a-zA-Z0-9-]+\.vercel\.app$ ]]; then
              echo "Verified Vercel Preview READY evidence for SHA ${COMMIT_SHA}: ${host}"
              exit 0
            fi
            echo "Waiting for exact-SHA Vercel Preview (attempt ${attempt}/24)."
            sleep 15
          done
          echo "::error::No verified exact-SHA Vercel Preview evidence."
          exit 1
